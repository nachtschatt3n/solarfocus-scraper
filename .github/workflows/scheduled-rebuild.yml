---
# Weekly scheduled rebuild — picks up Debian and pip security patches
# without requiring a code change. The base image (python:3.12-slim-trixie)
# floats to whatever Debian 13 has on rebuild day, and `apt-get upgrade`
# in the Dockerfile applies any point-release security patches.
#
# Why this exists: a CVE scan on this image (Trivy 0.70.0, 2026-05-09)
# flagged 2 CRITICAL + 23 HIGH from Debian system libs (libgnutls30t64,
# libarchive13t64, libgif7) — none of which require code changes; they
# disappear on the next rebuild against fresh Debian. Without a scheduled
# rebuild, the image only changes when source code does, so OS CVEs
# accumulate quietly.
name: Scheduled Rebuild

on:
  schedule:
    # Every Monday at 06:00 UTC. Picks up Debian patches typically published
    # on Mondays/Tuesdays. Also clears any stale base-image vulns mid-week.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write   # keepalive step re-enables this workflow

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/solarfocus-scraper

jobs:
  rebuild:
    name: Weekly rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Tag shape. The cluster pins `sha-<7 hex>` — the shape build.yml's
      # metadata-action publishes on push. This workflow used to publish
      # `sha-<40 hex>`, which nothing could ever pin, so its rebuilds were
      # never deployable. Publish `sha-<7>-b<YYYYMMDD>` instead: same commit
      # prefix the cluster already pins, plus a build-date suffix (the
      # rebuild-lane shape gods-eye-view uses, `<version>-b<YYYYMMDD>`).
      # The push-built `sha-<7>` tag is deliberately NOT overwritten: a pinned
      # tag must not change content underneath the cluster.
      - name: Compute tags
        id: date
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build (no-cache so base + apt are fresh; loaded for the test suite)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          no-cache: true
          pull: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:weekly
            ${{ env.IMAGE }}:weekly-${{ steps.date.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ steps.date.outputs.sha }}-b${{ steps.date.outputs.tag }}

      # Same in-image suite as build.yml's `test` job (see the rationale there:
      # the OCR fixtures only mean something against the shipped tesseract).
      - name: Run test suite inside the image
        run: |
          docker run --rm --user root \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}/tests:/app/tests:ro" \
            -v "${{ github.workspace }}/docs:/app/docs:ro" \
            "$IMAGE:weekly-${{ steps.date.outputs.tag }}" \
            sh -c "pip install --no-cache-dir --quiet pytest \
                   && python -m pytest -q -p no:cacheprovider /app/tests"

      - name: Push (the image that just passed the suite)
        run: |
          docker push "$IMAGE:sha-${{ steps.date.outputs.sha }}-b${{ steps.date.outputs.tag }}"
          docker push "$IMAGE:weekly-${{ steps.date.outputs.tag }}"
          docker push "$IMAGE:weekly"

      - name: Trivy scan (informational — does not fail the build)
        # Pin to a v-prefixed tag — aquasecurity yanked the un-prefixed `0.28.0`
        # tag at some point after this workflow was authored, which made every
        # Monday rebuild fail with "Unable to resolve action ... unable to find
        # version `0.28.0`".
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:weekly-${{ steps.date.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

      # GitHub disables scheduled workflows after 60 days without repo
      # activity -- this schedule silently stopped in July that way.
      # Re-enabling on every run resets the timer.
      - name: Keepalive (re-enable this workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled-rebuild.yml/enable"
