---
name: Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/solarfocus-scraper

jobs:
  # Runs the suite INSIDE the built image, not on the runner.
  #
  # That is the whole point: the Dockerfile pins python:3.12-slim-trixie for
  # tesseract 5.5.0 because 5.3.0 produces different LSTM output on small
  # anti-aliased digit glyphs, and requirements.txt pins Pillow 12.3.0 for the
  # get_flattened_data() API. A workstation venv on Python 3.9 / Pillow 11
  # cannot run the pixel-level tests at all (they raise AttributeError), and a
  # runner-installed tesseract would be a different build from production's.
  # Testing in the image is the only way the OCR fixtures mean anything.
  #
  # `build` depends on this, so a red suite blocks the push rather than
  # shipping and being noticed later.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: solarfocus-scraper:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # tests/ is deliberately not COPYed into the runtime image — mounting it
      # keeps the shipped image free of test code. Bytecode writing and the
      # pytest cache are disabled so the read-only mount is enough.
      - name: Run test suite inside the image
        run: |
          docker run --rm --user root \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${{ github.workspace }}/tests:/app/tests:ro" \
            solarfocus-scraper:test \
            sh -c "pip install --no-cache-dir --quiet pytest \
                   && python -m pytest -q -p no:cacheprovider /app/tests"

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
